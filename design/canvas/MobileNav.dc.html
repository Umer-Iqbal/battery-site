<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #FFFFFF; color: #0A0A0A; -webkit-font-smoothing: antialiased; }
    h1, h2, h3, h4 { font-family: 'Outfit', system-ui, sans-serif; margin: 0; }
    p { margin: 0; }
    a { color: #009DFF; text-decoration: none; }
    a:hover { color: #0081D1; }
    .wrap { padding: 0 24px; box-sizing: border-box; }
    .familyRow { display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 14px; min-height: 44px; box-sizing: border-box; }
    .navRow { display: flex; align-items: center; justify-content: space-between; min-height: 44px; font-size: 16px; line-height: 24px; font-weight: 500; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FFFFFF; overflow: hidden; position: relative; display: flex; flex-direction: column">

  <!-- navbar, open state -->
  <div style="padding: 12px 0; background: #FFFFFF; flex-shrink: 0">
    <div class="wrap" style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 10px">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M14.21 5.54 L6.04 10.25 L6.04 21.75 L16 27.5 L25.96 21.75 L25.96 10.25" stroke="#009DFF" stroke-width="3"></path>
          <path d="M25.96 10.25 L19.78 6.69" stroke="#7AC92C" stroke-width="3"></path>
        </svg>
        <span style="font-family: 'Outfit', system-ui, sans-serif; font-size: 16px; font-weight: 500; letter-spacing: 0.16em; color: #0A0A0A">ENERSOL</span>
      </div>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-end">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </div>
    </div>
  </div>

  <!-- open menu panel -->
  <div style="background: #FFFFFF; border-top: 1px solid #E5E5E5; flex-shrink: 0">
    <div class="wrap" style="padding-top: 20px; padding-bottom: 24px; display: flex; flex-direction: column; gap: 4px">

      <!-- Products, expanded into the four families -->
      <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
        <span style="font-size: 16px; line-height: 24px; font-weight: 500; color: #009DFF">Products</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#009DFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
      </div>

      <div style="display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px">
        <div class="familyRow" style="background: #F5F5F5">
          <div style="width: 34px; height: 34px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E5E5E5; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#009DFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="10" x="2" y="7" rx="2" ry="2"></rect><line x1="22" x2="22" y1="11" y2="13"></line></svg>
          </div>
          <div style="flex-grow: 1">
            <div style="font-size: 15px; line-height: 22px; font-weight: 500; color: #0A0A0A">LiFePO4 Batteries</div>
            <div style="font-size: 12px; line-height: 16px; color: #737373">12V to 51.2V · 6,000+ cycles</div>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
        </div>

        <div class="familyRow">
          <div style="width: 34px; height: 34px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E5E5E5; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#009DFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18.5" cy="17.5" r="3.5"></circle><circle cx="5.5" cy="17.5" r="3.5"></circle><circle cx="15" cy="5" r="1"></circle><path d="M12 17.5V14l-3-3 4-3 2 3h2"></path></svg>
          </div>
          <div style="flex-grow: 1">
            <div style="font-size: 15px; line-height: 22px; font-weight: 500; color: #0A0A0A">Electric Bikes</div>
            <div style="font-size: 12px; line-height: 16px; color: #737373">City, cargo and off-road</div>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
        </div>

        <div class="familyRow">
          <div style="width: 34px; height: 34px; border-radius: 12px; background: #F5F5F5; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A3A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
          </div>
          <div style="flex-grow: 1">
            <div style="font-size: 15px; line-height: 22px; font-weight: 500; color: #A3A3A3">Solar</div>
          </div>
          <span style="font-size: 10px; line-height: 14px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #737373; background: #F5F5F5; padding: 4px 8px; border-radius: 8px">Soon</span>
        </div>

        <div class="familyRow">
          <div style="width: 34px; height: 34px; border-radius: 12px; background: #F5F5F5; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A3A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
          </div>
          <div style="flex-grow: 1">
            <div style="font-size: 15px; line-height: 22px; font-weight: 500; color: #A3A3A3">Inverters</div>
          </div>
          <span style="font-size: 10px; line-height: 14px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #737373; background: #F5F5F5; padding: 4px 8px; border-radius: 8px">Soon</span>
        </div>
      </div>

      <div style="height: 1px; background: #E5E5E5; margin: 4px 0 8px"></div>

      <div class="navRow"><span style="color: #0A0A0A">Calculator</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></div>
      <div class="navRow"><span style="color: #0A0A0A">Mobile App</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></div>
      <div class="navRow"><span style="color: #0A0A0A">Dealer</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></div>
      <div class="navRow"><span style="color: #0A0A0A">Contact</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></div>

      <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 16px">
        <span style="display: flex; align-items: center; justify-content: center; min-height: 48px; background: #0A0A0A; color: #FFFFFF; font-weight: 500; border-radius: 16px; font-size: 14px; line-height: 20px; letter-spacing: 0.025em">Get Quote</span>
        <span style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; background: #7AC92C; color: #171717; font-weight: 500; border-radius: 16px; font-size: 14px; line-height: 20px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>
          WhatsApp Us
        </span>
      </div>

    </div>
  </div>

  <!-- page behind the menu -->
  <div style="flex-grow: 1; position: relative; overflow: hidden; border-top: 1px solid #E5E5E5">
    <img src="hero-battery.webp" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 58% 20%">
    <div style="position: absolute; inset: 0; background: rgba(255,255,255,0.62)"></div>
  </div>

</div>
</x-dc>
</body>
</html>
