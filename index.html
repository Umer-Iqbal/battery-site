<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enersol | LiFePO4 Batteries &amp; Electric Bikes</title>
    <meta name="description" content="LiFePO4 batteries and electric bikes engineered for Pakistan — reliable storage that rides out load-shedding, and e-bikes on the same cells." />
    <meta name="theme-color" content="#009DFF" />
    <link rel="canonical" href="https://enersol.pro/" />

    <!--
      Social link previews (Slack, WhatsApp, Facebook, LinkedIn, X, iMessage).
      These crawlers do NOT run JavaScript, so SeoHead.tsx's runtime tags are
      invisible to them — the image must be declared statically here, with an
      absolute URL. Keep in sync with DEFAULT_IMAGE in src/lib/seo-config.ts.
    -->
    <meta property="og:site_name" content="Enersol" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Enersol | LiFePO4 Batteries &amp; Electric Bikes" />
    <meta property="og:description" content="LiFePO4 batteries and electric bikes engineered for Pakistan." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://enersol.pro/" />
    <meta property="og:image" content="https://enersol.pro/brand/og-image.png" />
    <meta property="og:image:secure_url" content="https://enersol.pro/brand/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <!-- Declared dimensions let Slack/Facebook lay the card out before the image finishes downloading. -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Enersol — PowerPacks &amp; Electric Bikes" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Enersol | LiFePO4 Batteries &amp; Electric Bikes" />
    <meta name="twitter:description" content="LiFePO4 batteries and electric bikes engineered for Pakistan." />
    <meta name="twitter:image" content="https://enersol.pro/brand/og-image.png" />
    <meta name="twitter:image:alt" content="Enersol — PowerPacks &amp; Electric Bikes" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-background text-foreground antialiased">
    <noscript>
      <div style="padding:2rem;text-align:center;font-family:sans-serif;">
        Enersol requires JavaScript to run. Please enable JavaScript and reload.
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
